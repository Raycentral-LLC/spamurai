name: Spamurai
options:
  bundleIdPrefix: com.raycentral
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: QR6CDH9TM5
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Spamurai:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Intents
      # Debug gallery renders the widget views inside the app (see WidgetGallery).
      - Widget/WidgetViews.swift
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Spamurai
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.raycentral.spamurai]
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raycentral.spamurai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: ContentBlockerAds
      - target: ContentBlockerPrivacy
      - target: PacketTunnel
      - target: SpamuraiWidget
      - target: YouTubeExtension
      - framework: Frameworks/Libbox.xcframework
        link: false
        embed: true
      - sdk: AppIntents.framework
    scheme:
      storeKitConfiguration: App/Spamurai.storekit

  ContentBlockerAds:
    type: app-extension
    platform: iOS
    sources:
      - ContentBlocker/ContentBlockerRequestHandler.swift
      - path: ContentBlocker/Lists/ads.json
        buildPhase: resources
      - Shared
    info:
      path: Config/ContentBlockerAds-Info.plist
      properties:
        CFBundleDisplayName: Spamurai Ads
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SPListName: ads
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    entitlements:
      path: Config/ContentBlocker.entitlements
      properties:
        com.apple.security.application-groups: [group.com.raycentral.spamurai]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raycentral.spamurai.ContentBlockerAds

  ContentBlockerPrivacy:
    type: app-extension
    platform: iOS
    sources:
      - ContentBlocker/ContentBlockerRequestHandler.swift
      - path: ContentBlocker/Lists/privacy.json
        buildPhase: resources
      - Shared
    info:
      path: Config/ContentBlockerPrivacy-Info.plist
      properties:
        CFBundleDisplayName: Spamurai Privacy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SPListName: privacy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    entitlements:
      path: Config/ContentBlocker.entitlements
      properties:
        com.apple.security.application-groups: [group.com.raycentral.spamurai]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raycentral.spamurai.ContentBlockerPrivacy

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel, Shared]
    dependencies:
      - sdk: NetworkExtension.framework
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: WidgetKit.framework
    info:
      path: Config/PacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: Spamurai DNS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Config/PacketTunnel.entitlements
      properties:
        com.apple.security.application-groups: [group.com.raycentral.spamurai]
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raycentral.spamurai.PacketTunnel

  SpamuraiWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared, Intents]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Spamurai
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.raycentral.spamurai]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raycentral.spamurai.Widget

  YouTubeExtension:
    type: app-extension
    platform: iOS
    sources:
      - WebExtension/SafariWebExtensionHandler.swift
      - Shared
      # Web extension files must sit at the extension bundle's root.
      - path: WebExtension/Resources/manifest.json
        buildPhase: resources
      - path: WebExtension/Resources/background.js
        buildPhase: resources
      - path: WebExtension/Resources/youtube.js
        buildPhase: resources
      - path: WebExtension/Resources/youtube.css
        buildPhase: resources
      - path: WebExtension/Resources/icon-48.png
        buildPhase: resources
      - path: WebExtension/Resources/icon-96.png
        buildPhase: resources
      - path: WebExtension/Resources/icon-128.png
        buildPhase: resources
      - path: WebExtension/Resources/icon-256.png
        buildPhase: resources
      - path: WebExtension/Resources/icon-512.png
        buildPhase: resources
    info:
      path: Config/YouTubeExtension-Info.plist
      properties:
        CFBundleDisplayName: Spamurai YouTube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Config/YouTubeExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.raycentral.spamurai]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raycentral.spamurai.YouTube
